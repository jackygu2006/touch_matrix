<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="login.title">Touch Matrix · 登录</title>
<link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
<link rel="shortcut icon" type="image/png" href="/assets/icons/favicon-48x48.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/favicon-180x180.png">
<style>
:root {
  --bg: #0f1117; --surface: #1a1d27; --border: #2a2e3e;
  --text: #e1e4ed; --text2: #8b90a0; --accent: #6366f1; --accent-hover: #818cf8; --radius: 10px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; align-items:center; justify-content:center; }
.login-box { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:40px; width:380px; }
.login-box h1 { font-size:22px; font-weight:700; margin-bottom:4px; }
.login-box .ver { font-size:11px; color:var(--text2); margin-bottom:28px; }
.login-box label { display:block; font-size:12px; color:var(--text2); margin-bottom:4px; margin-top:16px; }
.login-box input { width:100%; padding:12px 16px; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius); color:var(--text); font-size:14px; outline:none; }
.login-box input:focus { border-color:var(--accent); }
.login-box button { width:100%; padding:12px; background:var(--accent); color:#fff; border:none; border-radius:var(--radius); cursor:pointer; font-size:14px; font-weight:600; margin-top:24px; }
.login-box button:hover { background:var(--accent-hover); }
.login-box .error { color:#f87171; font-size:12px; margin-top:12px; min-height:18px; }
</style>
</head>
<body>
<div class="login-box">
  <h1 data-i18n="login.heading">Touch Matrix</h1>
  <div class="ver" id="login-version">v0.2.0</div>
  <form onsubmit="doLogin(event)">
    <label data-i18n="login.email_label">邮箱</label>
    <input id="email" type="email" value="admin@nftouch.local" autofocus>
    <label data-i18n="login.password_label">密码</label>
    <input id="password" type="password" placeholder="请输入密码" data-i18n-placeholder="login.password_placeholder">
    <button type="submit" data-i18n="login.submit">登 录</button>
    <div class="error" id="error"></div>
  </form>
</div>
<script src="i18n.js"></script>
<script>
// Fetch server version
fetch('/api/version').then(function(r){ return r.json(); }).then(function(d){
  var el = document.getElementById('login-version');
  if (el && d.version) el.textContent = 'v' + d.version;
}).catch(function(){});

async function doLogin(e) {
  e.preventDefault();
  var email = document.getElementById('email').value.trim();
  var pwd = document.getElementById('password').value;
  if (!email || !pwd) return;
  try {
    var resp = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email: email, password: pwd})
    });
    var data = await resp.json();
    if (resp.ok) {
      localStorage.setItem('nftouch_token', data.token);
      localStorage.setItem('nftouch_user', JSON.stringify({email:data.email, nickname:data.nickname, role:data.role}));
      location.replace('/');
    } else {
      document.getElementById('error').textContent = data.error || __('login.failed');
    }
  } catch(ex) {
    document.getElementById('error').textContent = __('login.network_error');
  }
}
</script>
</body>
</html>
