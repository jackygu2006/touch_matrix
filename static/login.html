<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小奈Matrix · 登录</title>
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --border: #2a2e3e;
  --text: #e1e4ed;
  --text2: #8b90a0;
  --accent: #6366f1;
  --accent-hover: #818cf8;
  --radius: 10px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; align-items:center; justify-content:center; }
.login-box { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:40px; width:380px; text-align:center; }
.login-box h1 { font-size:22px; font-weight:700; margin-bottom:4px; letter-spacing:-0.5px; }
.login-box .ver { font-size:11px; color:var(--text2); margin-bottom:28px; }
.login-box label { display:block; text-align:left; font-size:12px; color:var(--text2); margin-bottom:4px; margin-top:16px; }
.login-box input { width:100%; padding:12px 16px; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius); color:var(--text); font-size:14px; outline:none; transition:border .15s; }
.login-box input:focus { border-color:var(--accent); }
.login-box button { width:100%; padding:12px; background:var(--accent); color:#fff; border:none; border-radius:var(--radius); cursor:pointer; font-size:14px; font-weight:600; margin-top:24px; transition:background .15s; }
.login-box button:hover { background:var(--accent-hover); }
.login-box .error { color:#f87171; font-size:12px; margin-top:12px; min-height:18px; }
</style>
</head>
<body>
<div class="login-box">
  <h1>小奈Matrix</h1>
  <div class="ver">v0.1.0</div>
  <form onsubmit="doLogin(event)">
    <label>用户名</label>
    <input id="username" type="text" value="admin" readonly>
    <label>密码</label>
    <input id="password" type="password" placeholder="请输入密码" autofocus>
    <button type="submit">登 录</button>
    <div class="error" id="error"></div>
  </form>
</div>
<script>
async function doLogin(e) {
  e.preventDefault();
  var pwd = document.getElementById('password').value;
  if (!pwd) return;
  try {
    var resp = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: 'admin', password: pwd})
    });
    if (resp.ok) {
      location.replace('/');
    } else {
      var data = await resp.json();
      document.getElementById('error').textContent = data.error || '登录失败';
    }
  } catch(ex) {
    document.getElementById('error').textContent = '网络错误';
  }
}
</script>
</body>
</html>
