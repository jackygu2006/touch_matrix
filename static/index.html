<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小奈Matrix · MVP</title>
<link rel="stylesheet" href="style.css">
<body>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <h2>小奈 Matrix</h2>
      <div style="display:flex;gap:6px;">
        <button id="grid-toggle" onclick="toggleGrid()" style="background:none;border:1px solid var(--border);color:var(--text2);padding:4px 8px;border-radius:6px;cursor:pointer;font-size:14px;" title="综合看板">▦</button>
        <button onclick="logout()" style="background:none;border:1px solid #ef4444;color:#ef4444;padding:4px 8px;border-radius:6px;cursor:pointer;font-size:14px;" title="登出">⤺</button>
      </div>
    </div>
    <div id="user-info" style="padding:4px 20px 8px 20px;font-size:11px;color:var(--text2);border-bottom:1px solid var(--border);display:none;"></div>
    <div id="device-list"></div>
    <div id="sort-bar" style="padding:4px 8px;display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--border);">
      <button onclick="sortDevices('id')" class="sort-btn" style="padding:2px 8px;background:var(--bg);border:1px solid var(--border);color:var(--text2);border-radius:4px;cursor:pointer;font-size:10px;">ID <span id="sort-id-dir"></span></button>
      <button onclick="sortDevices('model')" class="sort-btn" style="padding:2px 8px;background:var(--bg);border:1px solid var(--border);color:var(--text2);border-radius:4px;cursor:pointer;font-size:10px;">型号</button>
      <button onclick="sortDevices('time')" class="sort-btn" style="padding:2px 8px;background:var(--bg);border:1px solid var(--border);color:var(--text2);border-radius:4px;cursor:pointer;font-size:10px;">绑定时间</button>
    </div>
    <div id="sidebar-footer">
      <button class="sidebar-btn" onclick="showBindModal()">+ 绑定设备</button>
    </div>
  </div>
  <div class="resize-handle resize-handle-v" id="resize-sidebar"></div>
   <div id="main">
    <div id="screen-area">
      <div id="screen-canvas-area">
        <div class="placeholder" id="screen-placeholder">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
          选择一个设备查看实时屏幕
        </div>
        <canvas id="screen-canvas" class="hidden"></canvas>
        <div id="perm-warning" style="display:none;position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(245,158,11,.15);border:1px solid var(--warn);border-radius:8px;padding:6px 16px;font-size:12px;color:var(--warn);text-align:center;z-index:10;white-space:nowrap;"></div>
        <div id="screen-warning" style="display:none;position:absolute;top:38px;left:50%;transform:translateX(-50%);background:rgba(96,165,250,.12);border:1px solid var(--info);border-radius:8px;padding:6px 16px;font-size:12px;color:var(--info);text-align:center;z-index:10;white-space:nowrap;">📱 设备屏幕已关闭</div>
      </div>
      <div class="resize-handle resize-handle-v" id="resize-task"></div>
      <div id="task-panel">
        <div id="task-panel-header">
          <span>AI 任务</span>
        </div>
        <div id="task-msg" style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--text2);min-height:60px;overflow-y:auto;max-height:200px;"></div>
        <div id="task-panel-inputs">
          <input id="task-input" placeholder="输入任务，如：打开微信发消息给张三..." onkeydown="if(event.key==='Enter')sendTask()">
          <button id="execute-btn" onclick="sendTask()">▶ 执行</button>
        </div>
      </div>
    </div>
    <div id="grid-view" style="display:none;flex:1;overflow-y:auto;padding:12px;flex-wrap:wrap;gap:12px;align-content:flex-start;background:#000;">
      <div id="grid-toolbar" style="width:100%;padding:0 0 8px 0;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2);">
        每行 <select id="grid-cols" onchange="buildGrid()" style="background:var(--bg);border:1px solid var(--border);color:var(--text);padding:2px 6px;border-radius:4px;font-size:12px;">
          <option value="3">3</option><option value="4" selected>4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option>
        </select> 台
        <span style="flex:1;"></span>
        <span id="grid-count"></span>
      </div>
      <div id="grid-container" style="display:flex;flex-wrap:wrap;gap:12px;align-content:flex-start;width:100%;"></div>
    </div>
    <div id="cal-bar" style="background:var(--accent);color:#fff;padding:8px 20px;font-size:12px;display:none;align-items:center;gap:12px;">
      <span id="cal-bar-text">校准中...</span>
      <span id="cal-bar-step" style="opacity:.7;"></span>
      <button onclick="calNextStep()" id="cal-bar-btn" style="margin-left:auto;padding:4px 12px;border:1px solid rgba(255,255,255,.5);border-radius:6px;background:transparent;color:#fff;cursor:pointer;font-size:11px;display:none;">下一步</button>
      <button onclick="cancelCalibration()" style="padding:4px 8px;border:none;background:transparent;color:rgba(255,255,255,.6);cursor:pointer;font-size:16px;">×</button>
    </div>
    <div id="control-bar">
      <button class="quick-btn warn" onclick="sendKey('lock')" title="锁屏">锁屏</button>
      <button class="quick-btn" onclick="sendKey('home')" title="主页">主页</button>
      <button class="quick-btn" onclick="sendKey('back')" title="返回">返回</button>
      <span style="color:var(--border);margin:0 2px;user-select:none;">│</span>
      <button class="quick-btn gesture" onclick="sendGesture('up')" title="上滑">↑ 上滑</button>
      <button class="quick-btn gesture" onclick="sendGesture('down')" title="下滑">↓ 下滑</button>
      <button class="quick-btn gesture" onclick="sendGesture('left')" title="左滑">← 左滑</button>
      <button class="quick-btn gesture" onclick="sendGesture('right')" title="右滑">→ 右滑</button>
      <button class="quick-btn gesture" onclick="sendGesture('notify')" title="拉下通知栏">🔔 通知</button>
      <button class="quick-btn gesture" onclick="sendGesture('home_gesture')" title="应用">🏠 应用</button>
      <input id="text-input" placeholder="发送文字到手机..." onkeydown="if(event.key==='Enter'){sendText();event.preventDefault();}">
      <button class="quick-btn" onclick="sendText()" title="将文字粘贴到手机当前输入框">发送</button>
    </div>
    <div id="status-bar">
      <span id="status-left">未连接</span>
      <span id="status-right">
        <span id="cal-info" style="font-size:11px;color:var(--text2);"></span>
        &nbsp;<a href="#" onclick="send({type:'refresh'});return false;" style="color:var(--accent);text-decoration:none;">刷新</a>
      </span>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="bind-modal">
  <div class="modal">
    <h3>绑定设备</h3>
    <div id="bind-step1">
      <p style="color:var(--text2);font-size:13px;margin-bottom:16px;">在手机上打开 NFTouch → 设置 → 云控绑定，获取 6 位配对码</p>
      <input id="code-input" type="text" maxlength="6" placeholder="000000" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
      <div class="error hidden" id="bind-error"></div>
      <div class="actions">
        <button class="btn-cancel" onclick="hideBindModal()">取消</button>
        <button class="btn-confirm" onclick="doBind()">确认绑定</button>
      </div>
    </div>
    <div id="bind-result" class="hidden" style="text-align:center;">
      <div style="font-size:48px;margin:16px 0;color:var(--online);">✓</div>
      <p style="color:var(--text2);font-size:13px;margin-bottom:8px;">设备 <strong id="bind-device-id"></strong></p>
      <div style="background:var(--bg);border:1px solid var(--accent);border-radius:8px;padding:12px;word-break:break-all;font-family:monospace;font-size:11px;color:var(--accent);margin:12px 0;" id="bind-token"></div>
      <p style="color:var(--text2);font-size:12px;">复制以上 Token，在手机上填入</p>
      <div class="actions" style="margin-top:16px;">
        <button class="btn-confirm" onclick="copyToken()" style="margin-right:8px;">复制 Token</button>
        <button class="btn-cancel" onclick="hideBindModal()">关闭</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="dev-settings-modal">
  <div class="modal" style="width:400px;">
    <h3 id="dev-settings-title">设备设置</h3>
    <div id="dev-settings-content"></div>
    <div class="actions" style="margin-top:12px;">
      <button class="quick-btn" id="cal-start-btn" onclick="startCalibration()">开始校准</button>
      <button class="btn-cancel" onclick="document.getElementById('dev-settings-modal').classList.add('hidden')">关闭</button>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="admin-modal">
  <div class="modal" style="width:600px;max-height:80vh;overflow-y:auto;">
    <h3>用户管理 <button class="quick-btn" onclick="showNewUserDialog()" style="margin-left:12px;">+ 新建用户</button></h3>
    <table style="width:100%;border-collapse:collapse;font-size:13px;" id="admin-user-table">
      <tr style="color:var(--text2);"><th style="text-align:left;padding:8px;">邮箱</th><th>角色</th><th>设备配额</th><th>状态</th><th>操作</th></tr>
    </table>
    <div class="actions" style="margin-top:12px;">
      <button class="btn-cancel" onclick="document.getElementById('admin-modal').classList.add('hidden')">关闭</button>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="edit-user-modal">
  <div class="modal" style="width:380px;">
    <h3 id="edit-user-title">编辑用户</h3>
    <label id="eu-email-label" style="font-size:12px;color:var(--text2);">邮箱</label>
    <input id="eu-email" style="font-size:14px;padding:8px 12px;margin-bottom:8px;" placeholder="user@example.com">
    <label id="eu-nick-label" style="font-size:12px;color:var(--text2);">昵称</label>
    <input id="eu-nickname" style="font-size:14px;padding:8px 12px;margin-bottom:8px;" placeholder="显示名称">
    <label style="font-size:12px;color:var(--text2);">密码<span id="eu-pw-hint" style="color:var(--text2);">（留空不修改）</span></label>
    <input id="eu-password" type="password" style="font-size:14px;padding:8px 12px;margin-bottom:8px;">
    <label style="font-size:12px;color:var(--text2);">设备配额</label>
    <input id="eu-quota" type="number" min="1" style="font-size:14px;padding:8px 12px;margin-bottom:12px;width:80px;">
    <input type="hidden" id="eu-id">
    <div class="error hidden" id="eu-error" style="margin-bottom:8px;"></div>
    <div class="actions">
      <button class="btn-cancel" onclick="document.getElementById('edit-user-modal').classList.add('hidden')">取消</button>
      <button class="btn-confirm" onclick="saveEditUser()">保存</button>
    </div>
  </div>
</div>

<script src="state.js"></script>
<script src="devices.js"></script>
<script src="ui.js"></script>
<script src="admin.js"></script>
</body>
</html>
